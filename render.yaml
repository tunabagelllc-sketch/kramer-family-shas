# Render Blueprint: one free web service. The database is a free Neon Postgres project;
# all tables live in the kramer_shas schema.
services:
  - type: web
    name: kramer-family-shas
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # Neon connection string (direct, not pooled)
      - key: FAMILY_CODE
        sync: false          # the code family members type once per device, e.g. KRAMER-5786
      - key: SESSION_SECRET
        generateValue: true
